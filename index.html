<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>README File Manager</title>
    <!-- Include Marked.js for parsing Markdown -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 2rem; max-width: 800px; }
        #file-manager { border: 1px solid #e1e4e8; padding: 2rem; border-radius: 6px; background-color: #fafbfc; }
        ul { list-style-type: none; padding-left: 20px; }
        li { margin: 0.5rem 0; }
        a { text-decoration: none; color: #0366d6; font-weight: 500; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <h1>Repository File Manager</h1>
    <div id="file-manager">Loading files from README...</div>

    <script>
        // Target repository configuration
        const owner = 'siddharth2798';
        const repo = 'siddharth2798.github.io';
        const branch = 'main'; // Change to 'master' if needed

        // Raw URL to fetch the README file directly
        const readmeUrl = `https://githubusercontent.com{owner}/${repo}/${branch}/README.md`;
        // Base URL to fix relative links inside the README
        const baseUrl = `https://github.com{owner}/${repo}/blob/${branch}/`;

        async function loadFileManagerFromReadme() {
            try {
                const response = await fetch(readmeUrl);
                if (!response.ok) throw new Error('Could not fetch the README.md file.');
                
                const markdownText = await response.text();
                
                // Convert Markdown to HTML using Marked.js
                let htmlContent = marked.parse(markdownText);

                // Fix relative file links so they point to the actual GitHub repository files
                const container = document.createElement('div');
                container.innerHTML = htmlContent;
                
                const links = container.querySelectorAll('a');
                links.forEach(link => {
                    const href = link.getAttribute('href');
                    // If the link is relative (doesn't start with http/https), prepend the GitHub base URL
                    if (href && !href.startsWith('http://') && !href.startsWith('https://')) {
                        link.href = baseUrl + href;
                        link.target = '_blank'; // Open files in a new tab
                    }
                });

                document.getElementById('file-manager').innerHTML = container.innerHTML;

            } catch (error) {
                document.getElementById('file-manager').textContent = `Error: ${error.message}`;
            }
        }

        loadFileManagerFromReadme();
    </script>
</body>
</html>
